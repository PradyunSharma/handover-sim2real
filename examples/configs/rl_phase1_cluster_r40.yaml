# Phase-3 RL config — rl_run40 (CLUSTER, 16 workers). ANTI-DECAY probe over a LONG run.
# Base = rl_run28 (from-scratch, drop_joint, wrist 5-ch, vgd, decay curriculum) with:
#   (1) num_iters 250 -> 500 (long post-curriculum hold to watch retention);
#   (2) capacity 20k -> 200000 (~non-evicting: 500 iters * ~480 trans/iter ~= 240k, a 200k
#       buffer keeps almost everything -> near-max near-grasp success retention);
#   (3) curriculum STRETCHED to occupy the first half: expert_initial_anneal_iters 150->250
#       and demo_frac_ramp 125->250 (anneal 0..250, then hold [2,24] / demo_frac 0.3 for 250..500).
# Network UNCHANGED (baseline feature_dim 256 / heads [256,256]). Tests: does a big buffer +
# stretched curriculum HOLD the run28 peak (~0.375) instead of decaying to ~0.05?
# Launch: sbatch --export=ALL,RUN_NAME=rl_run40,RL_CFG=examples/configs/rl_phase1_cluster_r40.yaml,DEMOS=output/rl_demos/train_h30_vgd.h5 examples/slurm/train_rl.sbatch
# WALL-CLOCK: 500 iters ~= 2x run28 -> may exceed the 24h cap; checkpoints every save_every(7),
# --resume output/rl_runs/rl_run40/checkpoints/last.pt. ~200k*(1024*5*4B + ...) buffer ~ a few GB.

warm_start: false   # from scratch — do NOT borrow the BC policy/critic weights

DATA:
  num_pts:         1024
  pc_channels:     5

MODEL:
  q_hidden:  [256, 256]
  clock_dim: 1
  drop_joint_state: true   # drop joint_pos(9)+joint_vel(9) from the robot MLP input

RL:
  gamma:        0.95
  tau:          0.005
  policy_noise: 0.2
  noise_clip:   0.5
  act_limit:    5.0
  policy_delay: 2
  mc_blend:     0.5
  pose_loss:    smooth_l1
  bc_weight:    2.0
  gripper_bc_weight: 1.0
  gripper_close_weight_max: 10.0
  gripper_label_smooth: 0.1
  shaping_pos_weight: 0.0
  shaping_rot_weight: 0.0
  aux_weight:   0.5
  reward_mode:  stable_grasp
  hold_steps:   3
  valid_grasp_dict_path: examples/valid_grasp_dict_005.pkl
  hand_collision_filter: false
  hand_collision_thresh: 0.08
  hand_points_radius:    0.35
  pg_normalize: true
  alpha:        0.1
  mix_start:    0.1
  mix_end:      0.2
  mix_ramp:     50000
  actor_lr:     3.0e-4
  critic_lr:    3.0e-4
  grad_clip:    1.0

LOOP:
  capacity:             200000   # run28 20k -> 200k (near-non-evicting over 500 iters)
  pretrain_updates:     2000
  demo_frac:            0.25
  demo_frac_start:      0.5
  demo_frac_end:        0.3
  demo_frac_ramp:       250      # run28 125 -> 250 (anneal over the first half)
  warmup_episodes:      0
  warmup_beta:          1.0
  episodes_per_iter:    16
  updates_per_iter:     800
  batch_size:           64
  num_iters:            500      # run28 250 -> 500 (long post-curriculum hold)
  # exploration
  noise_std:            0.03
  # ── WIDENING reverse curriculum (anneal window stretched to 250) ───────────
  expert_initial_hi:            24
  expert_initial_lo_start:      22
  expert_initial_lo_end:        2
  expert_initial_anneal_iters:  250   # run28 150 -> 250 (curriculum ends at iter 250)
  expert_episode_frac:  0.5
  rollout_max_steps:    30
  dagger_ratio:         0.5
  dagger_min_step:      5
  dagger_tail_guard:    8
  dart_mode:            policy
  dart_ratio:           0.2
  dart_min_step:        15
  dart_max_step:        22
  dart_pos_mag:         0.04
  dart_rot_mag:         0.2
  beta_start:           0.5
  beta_end:             0.0
  beta_ramp_iters:      63
  eval_every:           7
  eval_episodes:        64
  save_every:           7
