# ─────────────────────────────────────────────────────────────────────────────
# Phase-5 learner config: the grasp-CONDITIONED single-frame BC policy.
#
# = examples/configs/bc_phase4_all.yaml (runs 15/16) with four changes, three of
# which are forced by the fourth.
#
#   1. MODEL.grasp_cond: true          THE change. The goal grasp, expressed in
#                                      the current EE frame, becomes an INPUT.
#   2. MODEL.aux_head: false           Forced. With (1) the aux head's target IS
#      LOSS.aux_weight: 0.0            its own input; it would learn an identity
#                                      map and carry no signal.
#   3. MODEL.policy_hidden [512, 256]  The fused vector grows 512 -> 640, and the
#                                      first head layer is where conditioning and
#                                      perception have to mix.
#   4. MODEL.pc_pretrained: (empty)    PointNet++ from scratch, as run 21 does —
#                                      the CVPR2023 encoder was trained on a
#                                      different rig, and it was ALSO trained with
#                                      an aux goal head we are now removing.
#
# WHY THE CONDITIONING IS NOT OPTIONAL. Phase 5 pins four grasps per scene, so
# the same (point cloud, robot state) carries four different expert labels. An
# unconditioned regression can only predict their mean, which is a valid action
# for none of the four — strictly worse than a Phase-4 policy. Conditioning is
# what makes the mapping single-valued again. train_dagger_phase5.py refuses to
# start if the pin table has several grasps and this flag is off.
#
# 2 AND 1 MOVE TOGETHER and cannot be separated: the confound is real and is
# stated rather than hidden. If you want the aux head back, it has to predict
# something the policy is NOT already given.
#
# THE CONDITIONING VECTOR is rot6d(6) + translation(3), built by
# bc5.dataset.goal_cond_from_state from the RAW robot state and the episode's
# `grasp_pose_world` attr. rot6d, not the aux head's quaternion: as a regression
# target the quaternion double cover (q == -q) is absorbed by the geodesic loss,
# but as a network INPUT it makes the function the encoder must learn
# discontinuous. It is recomputed every step — the world grasp is fixed, the EE
# moves — so it is the residual pose the policy still has to null out.
#
# NOT NORMALIZED. It is already an EE-relative displacement in metres, centred
# near zero by construction, and normalizing it would make it depend on dataset
# statistics the real robot cannot reproduce.
#
# SIZED AT 128, a fifth of the 640-D fused vector: enough not to be drowned by
# 512 dims of perception, not so much that the head can solve the task by
# servoing to the goal and ignoring the cloud. That shortcut does exist — it
# would fly straight through the human's hand, which is precisely what OMG's
# labels do not do, so the loss pushes back. Watch `f_human_contact` anyway.
#
# CAPACITY IS NOT SCALED WITH THE DATA, deliberately. The aggregate grows ~2.2x
# against run 16, not 4x (D_dagger_frac reaches 0.90, so the base set is a tenth
# of it), the new axis of variation is a 9-D pose rather than new perceptual
# complexity, and 87% of the parameters sit in a PointNet++ whose job has not
# changed. Phase-3 runs 41 (deeper) and 42 (smaller) bracket run 28 on both sides
# and neither moved the number beyond the +-0.115 noise floor. Total here is
# 2.04 M against run 16's 1.96 M — the head widening and the grasp encoder very
# nearly cancel the aux head that was removed.
#
# REACH-TAIL OVERSAMPLING MATTERS MORE HERE, not less. The four grasps of a scene
# produce near-identical free approaches and only diverge in the reach, so most
# of the conditioning signal lives in exactly the steps `reach_tail_weight`
# upweights. Kept at run 16's 2.5.
# ─────────────────────────────────────────────────────────────────────────────

DATA:
  # Overwritten by train_dagger_phase5.py with the aggregate file list.
  train_h5: output/bc_dataset/train_p5.h5
  val_h5: null
  pc_channels: 5              # xyz + ycb_flag + hand_flag  (2-class, wrist+right)
  robot_state_dim: 32
  action_dim: 7
  reach_tail_weight: 2.5
  reach_tail: 5

MODEL:
  feature_dim: 256
  robot_hidden: 128
  policy_hidden: [512, 256]
  pointnet_scale: 1
  pointnet_radius: 0.02
  pointnet_nclusters: 32
  use_prev_act: false
  drop_joint_state: true      # the single largest effect measured in this project
  joint_state_dim: 18
  # ---- Phase 5 ----
  grasp_cond: true
  grasp_cond_dim: 9           # rot6d(6) + trans(3)
  grasp_hidden: 128
  grasp_feat_dim: 128
  # ---- off, and why: see the header ----
  aux_head: false
  aux_dim: 7
  aux_hidden: [256, 256]
  # Empty => random PointNet++ init. Only iteration 0 is affected; later
  # iterations warm-start from the previous checkpoint and never read this.
  pc_pretrained:
  freeze_pc: false

OPTIM:
  kind: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine

LOSS:
  gripper_weight: 1.0
  pose_loss: pm
  pm_weight: 7.0
  aux_weight: 0.0             # must be 0 while grasp_cond is on

TRAIN:
  batch_size: 64
  num_epochs: 100             # overridden per fit by DAGGER's base/iter epochs
  num_workers: 4
  device: cuda
  mixed_precision: false
  val_every: 1
  save_every: 5
  grad_clip: 1.0
  seed: 0
