# Phase-3 RL config — rl_run42 (CLUSTER, 16 workers). CAPACITY probe: SMALLER network.
# Base = rl_run28 (from-scratch, drop_joint, wrist 5-ch, vgd, decay curriculum) with:
#   (1) num_iters 250 -> 500;
#   (2) capacity 20k -> 100000;
#   (3) SMALLER net — actor head policy_hidden + critic head q_hidden [256,256] -> [128,128]
#       AND feature_dim 256 -> 128 (narrower scene/robot features + fused head). Roughly a
#       quarter of the head params and half the feature width. RL-config dim overrides are
#       honored ONLY because warm_start=false (from-scratch). pointnet_scale left at 1 (the
#       PointNet++ backbone is held fixed so both nets see the same point features; only the
#       reasoning head + feature bottleneck shrink).
# Pairs with rl_run41 (DEEPER net) as a two-sided capacity A/B at 100k buffer / 500 iters.
# CURRICULUM = run28 DEFAULT (anneal 150, demo_frac_ramp 125), same as run41 (clean net A/B).
# Launch: sbatch --export=ALL,RUN_NAME=rl_run42,RL_CFG=examples/configs/rl_phase1_cluster_r42.yaml,DEMOS=output/rl_demos/train_h30_vgd.h5 examples/slurm/train_rl.sbatch

warm_start: false   # from scratch — REQUIRED to override the network dims below

DATA:
  num_pts:         1024
  pc_channels:     5

MODEL:
  q_hidden:  [128, 128]        # critic head: SMALLER (256 -> 128 wide)
  policy_hidden: [128, 128]    # actor head: SMALLER (overrides the BC run's [256,256])
  feature_dim: 128             # SMALLER scene/robot feature width (256 -> 128); fused head 2*128+1
  clock_dim: 1
  drop_joint_state: true

RL:
  gamma:        0.95
  tau:          0.005
  policy_noise: 0.2
  noise_clip:   0.5
  act_limit:    5.0
  policy_delay: 2
  mc_blend:     0.5
  pose_loss:    smooth_l1
  bc_weight:    2.0
  gripper_bc_weight: 1.0
  gripper_close_weight_max: 10.0
  gripper_label_smooth: 0.1
  shaping_pos_weight: 0.0
  shaping_rot_weight: 0.0
  aux_weight:   0.5
  reward_mode:  stable_grasp
  hold_steps:   3
  valid_grasp_dict_path: examples/valid_grasp_dict_005.pkl
  hand_collision_filter: false
  hand_collision_thresh: 0.08
  hand_points_radius:    0.35
  pg_normalize: true
  alpha:        0.1
  mix_start:    0.1
  mix_end:      0.2
  mix_ramp:     50000
  actor_lr:     3.0e-4
  critic_lr:    3.0e-4
  grad_clip:    1.0

LOOP:
  capacity:             100000
  pretrain_updates:     2000
  demo_frac:            0.25
  demo_frac_start:      0.5
  demo_frac_end:        0.3
  demo_frac_ramp:       125
  warmup_episodes:      0
  warmup_beta:          1.0
  episodes_per_iter:    16
  updates_per_iter:     800
  batch_size:           64
  num_iters:            500
  noise_std:            0.03
  expert_initial_hi:            24
  expert_initial_lo_start:      22
  expert_initial_lo_end:        2
  expert_initial_anneal_iters:  150
  expert_episode_frac:  0.5
  rollout_max_steps:    30
  dagger_ratio:         0.5
  dagger_min_step:      5
  dagger_tail_guard:    8
  dart_mode:            policy
  dart_ratio:           0.2
  dart_min_step:        15
  dart_max_step:        22
  dart_pos_mag:         0.04
  dart_rot_mag:         0.2
  beta_start:           0.5
  beta_end:             0.0
  beta_ramp_iters:      63
  eval_every:           7
  eval_episodes:        64
  save_every:           7
