# Phase-3 RL config — rl_run30 (CLUSTER, 16 workers). Base = rl_run28's yaml
# (from-scratch, drop_joint_state, vgd hand filter, widening curriculum, 250 iters)
# but the ACTOR is the Phase-2 ACT architecture (Design A: temporal obs, single-
# action RL). See handover_sim2real/rl/actor_act.py + scratchpad/act_in_rl_plan.md.
#
# WHAT CHANGES vs r28: MODEL.arch mlp -> act. The actor is now a temporal
# transformer over the last history_len=4 frames of [scene ⊕ robot] tokens, but
# still emits ONE action per step (chunk_len=1). The critic, replay-buffer Bellman
# math, TD3 policy-gradient path, BC/gripper/aux losses, and the whole RL block are
# UNCHANGED single-step — the only new thing is the actor's 4-frame context. This is
# the low-risk probe of "does temporal context help the policy". It does NOT use ACT
# chunking / temporal ensembling / CVAE (that is Design B; flip chunk_len=8 +
# use_cvae=true to reach it — the code already supports it).
#
# arch=act is FROM-SCRATCH only (can't 1:1 load the single-frame BC MLP), so
# warm_start MUST be false (train_rl raises otherwise). drop_joint_state=true is
# inherited from r28 (robot-MLP input 8-D). The buffer + demo pool store/serve the
# 4-frame histories automatically (reconstructed from the single-frame demos at
# load — no re-collection). Pair with:  --demos output/rl_demos/train_h30_vgd.h5
# COST/RISK: ~4x actor PointNet++ forwards per step & per update (rollout throughput
# + iter time up); cold start (random 8.9M-param transformer + random PN++) in 250
# iters is a deliberately short probe — extend num_iters if the curve is still rising.

warm_start: false   # ACT actor is from-scratch (no single-frame BC weights to load)

DATA:
  num_pts:         1024
  pc_channels:     5

MODEL:
  q_hidden:  [256, 256]
  clock_dim: 1
  drop_joint_state: true    # drop joint_pos(9)+joint_vel(9) from the robot MLP input
  # ── Phase-2 ACT actor (Design A) ──
  arch:            act       # mlp (default single-frame) | act (temporal transformer)
  history_len:     4         # T observation frames the actor attends over
  chunk_len:       1         # Design A: single-action RL. Design B: 8
  use_cvae:        false     # Design A: no CVAE (degenerate at chunk_len=1). Design B: true
  d_model:         256       # = feature_dim; the temporal-token width
  n_heads:         4
  enc_layers:      3         # temporal encoder depth
  dec_layers:      3         # chunk decoder depth
  cvae_enc_layers: 2         # (unused while use_cvae=false)
  latent_dim:      32        # (unused while use_cvae=false)
  dropout:         0.1

RL:
  gamma:        0.95
  tau:          0.005
  policy_noise: 0.2
  noise_clip:   0.5
  act_limit:    5.0
  policy_delay: 2
  mc_blend:     0.5
  pose_loss:    smooth_l1
  bc_weight:    2.0
  gripper_bc_weight: 1.0
  gripper_close_weight_max: 10.0
  gripper_label_smooth: 0.1
  shaping_pos_weight: 0.0
  shaping_rot_weight: 0.0
  aux_weight:   0.5
  reward_mode:  stable_grasp
  hold_steps:   3
  # HAND-COLLISION FILTER — PAPER'S offline valid_grasp_dict (run21/vgd), NOT run15's
  # runtime 0.08 m filter. hand_collision_filter=false so our runtime filter is OFF.
  valid_grasp_dict_path: examples/valid_grasp_dict_005.pkl
  hand_collision_filter: false
  hand_collision_thresh: 0.08   # (unused while hand_collision_filter=false)
  hand_points_radius:    0.35   # (unused while hand_collision_filter=false)
  pg_normalize: true
  alpha:        0.1
  mix_start:    0.1
  mix_end:      0.2
  mix_ramp:     50000
  actor_lr:     3.0e-4
  critic_lr:    3.0e-4
  grad_clip:    1.0

LOOP:
  capacity:             20000
  pretrain_updates:     2000
  demo_frac:            0.25
  demo_frac_start:      0.5
  demo_frac_end:        0.3
  demo_frac_ramp:       125
  warmup_episodes:      0
  warmup_beta:          1.0
  episodes_per_iter:    16
  updates_per_iter:     800
  batch_size:           64
  num_iters:            250     # short probe (extend if still rising)
  # exploration
  noise_std:            0.03
  # ── WIDENING reverse curriculum (same as run23/r28) ───────────────────────
  expert_initial_hi:            24    # FIXED upper takeover bound
  expert_initial_lo_start:      22    # band [22,24] at iter 0
  expert_initial_lo_end:        2     # band [2,24] after anneal
  expert_initial_anneal_iters:  150   # anneal 0..150, then hold [2,24]
  expert_episode_frac:  0.5
  rollout_max_steps:    30
  # DAgger tail replans (run15 values)
  dagger_ratio:         0.5
  dagger_min_step:      5
  dagger_tail_guard:    8
  # DART — policy-DART, ratio 0.2
  dart_mode:            policy
  dart_ratio:           0.2
  dart_min_step:        15
  dart_max_step:        22
  dart_pos_mag:         0.04
  dart_rot_mag:         0.2
  beta_start:           0.5
  beta_end:             0.0
  beta_ramp_iters:      63
  # eval / checkpoint
  eval_every:           7
  eval_episodes:        64
  save_every:           7
