# Phase-3 RL config — rl_run47 (CLUSTER, 16 workers).
# IDENTICAL to rl_phase1_cluster_r28.yaml except RL.gamma 0.95 -> 0.99 (see the
# note at that key). Everything below is run 28's text, kept verbatim so the
# comparison isolates one variable.
#
# Original run-28 header follows.
# ---------------------------------------------------------------------------
# Phase-3 RL config — rl_run28 (CLUSTER, 16 workers). Base = rl_run25's yaml with THREE
# changes: (1) num_iters 700 -> 250; (2) warm_start: false — train the actor + critic
# FROM SCRATCH (no BC weights; the BC run still supplies the net DIMS + action
# normalizer); (3) MODEL.drop_joint_state: true — strip joint_pos(9)+joint_vel(9) from
# the robot-MLP input (the action is EE-frame, so the EE pose already in the state
# carries the kinematics; joint-space is redundant + scene-correlated → a memorization
# handle). Robot-MLP input drops 26 -> 8 dims: [ee_pos(3), ee_orn(4), gripper(1)].
#
# drop_joint_state REQUIRES warm_start=false (it changes the robot-encoder in_dim, so BC
# weights can't be loaded — train_rl.py raises if both are set). The buffer/normalizer
# still store/normalize the full 32-D state; the actor/critic slice to the kept 8 dims.
# Pair with the vgd demos:  --demos output/rl_demos/train_h30_vgd.h5
# CAVEAT: from-scratch typically needs MORE iters (BC's competence must be re-learned
# online); 250 is a deliberately short probe of "does the trimmed EE-frame state train".

warm_start: false   # from scratch — do NOT borrow the BC policy/critic weights

DATA:
  num_pts:         1024
  pc_channels:     5

MODEL:
  q_hidden:  [256, 256]
  clock_dim: 1
  drop_joint_state: true   # drop joint_pos(9)+joint_vel(9) from the robot MLP input

RL:
  # 0.99, the ONLY change from run 28 (which used 0.95).
  #
  # With reward_mode: stable_grasp the reward is sparse — one terminal payoff at
  # the held grasp, nothing along the way. gamma then sets how far back that
  # single signal propagates, with an effective horizon of 1/(1-gamma):
  #
  #     0.95 -> ~20 steps      0.99 -> ~100 steps
  #
  # rollout_max_steps is 30, so 0.95 discounts the terminal reward to 0.95^30 =
  # 0.21 at the start of an episode — a first step is credited a fifth of what the
  # last one gets. At 0.99 that becomes 0.99^30 = 0.74, so early approach actions
  # carry nearly the same weight as the closure. For a task whose whole difficulty
  # is a long approach ending in one sparse payoff, that is the more defensible
  # setting; 0.95 was effectively telling the critic the approach barely matters.
  #
  # The cost is variance: a longer credit horizon means noisier value targets and
  # usually slower early progress. Watch the critic loss and Q magnitudes against
  # run 28's — if Q diverges or the critic loss climbs steadily, that is 0.99
  # bootstrapping over too long a horizon for 250 iterations to settle.
  gamma:        0.99
  tau:          0.005
  policy_noise: 0.2
  noise_clip:   0.5
  act_limit:    5.0
  policy_delay: 2
  mc_blend:     0.5
  pose_loss:    smooth_l1
  bc_weight:    2.0
  gripper_bc_weight: 1.0
  gripper_close_weight_max: 10.0
  gripper_label_smooth: 0.1
  shaping_pos_weight: 0.0
  shaping_rot_weight: 0.0
  aux_weight:   0.5
  reward_mode:  stable_grasp
  hold_steps:   3
  # HAND-COLLISION FILTER — PAPER'S offline valid_grasp_dict (run21/vgd), NOT run15's
  # runtime 0.08 m filter. hand_collision_filter=false so our runtime filter is OFF.
  valid_grasp_dict_path: examples/valid_grasp_dict_005.pkl
  hand_collision_filter: false
  hand_collision_thresh: 0.08   # (unused while hand_collision_filter=false)
  hand_points_radius:    0.35   # (unused while hand_collision_filter=false)
  pg_normalize: true
  alpha:        0.1
  mix_start:    0.1
  mix_end:      0.2
  mix_ramp:     50000
  actor_lr:     3.0e-4
  critic_lr:    3.0e-4
  grad_clip:    1.0

LOOP:
  capacity:             20000
  pretrain_updates:     2000
  demo_frac:            0.25
  demo_frac_start:      0.5
  demo_frac_end:        0.3
  demo_frac_ramp:       125
  warmup_episodes:      0
  warmup_beta:          1.0
  episodes_per_iter:    16
  updates_per_iter:     800
  batch_size:           64
  num_iters:            250     # run28: back to 250 (run25 used 700)
  # exploration
  noise_std:            0.03
  # ── WIDENING reverse curriculum (same as run23) ───────────────────────────
  expert_initial_hi:            24    # FIXED upper takeover bound
  expert_initial_lo_start:      22    # band [22,24] at iter 0
  expert_initial_lo_end:        2     # band [2,24] after anneal
  expert_initial_anneal_iters:  150   # unchanged: anneal 0..150, then hold [2,24]
  expert_episode_frac:  0.5
  rollout_max_steps:    30
  # DAgger tail replans (run15 values)
  dagger_ratio:         0.5
  dagger_min_step:      5
  dagger_tail_guard:    8
  # DART — run23 values (policy-DART, ratio 0.2)
  dart_mode:            policy
  dart_ratio:           0.2
  dart_min_step:        15
  dart_max_step:        22
  dart_pos_mag:         0.04
  dart_rot_mag:         0.2
  beta_start:           0.5
  beta_end:             0.0
  beta_ramp_iters:      63
  # eval / checkpoint
  eval_every:           7
  eval_episodes:        64
  save_every:           7
