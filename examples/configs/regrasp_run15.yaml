# ─────────────────────────────────────────────────────────────────────────────
# REGRASP RUN 15 — RUN 12 REDONE: CORRECTED DART DOSE **AND** A WARM-STARTED CHAIN.
#
# Run 12's substrate — the `_off` tables and shards, `d_rule: grasp_offset`, the
# continuous label (`d_source: d_grasp_world`) with `command_deploy: bin_centroid`,
# `reach_filter: true`, `episodes_per_iter: 600`, 25 iterations, beta 0.9 -> 0.75
# — with the two things run 12 got wrong repaired and the initialisation changed.
#
#   DAGGER.dart_noise_ratio   1.0  -> 0.3     the fault that broke run 12
#   DAGGER.dart_alpha_scale   1.0  -> 0.25    recalibrated to THIS stack's anchor
#   DAGGER.dart_alpha_end     0.25 -> 0.12
#   TRAIN.train_from_scratch  true -> false   warm-started chain
#   TRAIN.init_ckpt           best -> last
#   TRAIN.iter_epochs         15   -> 20
#
# ── THIS IS A TWO-AXIS CHANGE AND THAT LIMITS WHAT IT CAN SETTLE ─────────────
#
# Against run 12 it changes both the DART dose and the initialisation, so a gap
# cannot be attributed to either. It is NOT the run that isolates the warm start
# on this stack, and it is not the run that isolates the dose either.
#
# WHAT IT IS FOR: it pairs with run 14. The two carry the same corrected dose and
# the same warm-started chain on two different substrates —
#
#     run 14   approach_axis, run 9's tables, reach_filter OFF, m=400
#     run 15   grasp_offset,  `_off` tables,  reach_filter ON,  m=600
#
# — so an effect visible in both is a property of the intervention, one visible
# in neither kills it, and one visible in only one says it interacts with the
# substrate. That is the same replication logic runs 12 and 13 were built on,
# which is why `iter_epochs` is 20 here rather than run 12's 15: matching run 14
# is what makes the pair a single-variable comparison. If you would rather have
# the literal "run 12 plus two fixes", set it back to 15 — one key, but then
# run 15 and run 14 differ in two ways instead of one.
#
# ── THE DOSE CORRECTION IS STACK-SPECIFIC ────────────────────────────────────
#
# alpha multiplies tr(Sigma_hat_1), the first iteration's MEASURED learner error,
# and the two stacks measure different values:
#
#     `_off` stack (runs 10/11/12)   anchor 0.0408   -> alpha 0.25 -> 0.12  HERE
#     run 9 stack  (runs 13/14)      anchor 0.0287   -> alpha 0.35 -> 0.18
#
# Both land the applied trace at ~0.0102, i.e. the same executed magnitude:
# roughly [1.4, 1.5, 1.8] cm and [0.066, 0.054, 0.046] rad in the free phase.
# DO NOT copy run 14's 0.35 onto this config — it would run 1.4x hot.
#
# ── WHAT RUN 12 ACTUALLY DID, SO THIS ONE IS READ CORRECTLY ─────────────────
#
# Run 12 finished 25 iterations and regressed: 0.562 @it22 against run 11's
# 0.619, with D ending at 2147 episodes against 3660 — 41% less data from the
# same scene budget. The cause was the firing rate, not the magnitude.
# `dart_noise` fires only on EXPERT steps, so ratio 1.0 at beta 0.9 perturbed
# 90% of all steps against the jolt's 26%. With no clean steps the EE never
# converged inside `reach_commit_dist: 0.05`, so the reach never committed:
#
#     c_max_steps        21 -> 92         reached_standoff  129 -> 59
#     mean_min_pos    0.049 -> 0.131      close labels      58% -> 26%
#     c_env_done         52 -> 46   (BETTER — the object was knocked out LESS)
#
# Iteration 1 ran the bootstrap, below the jolt in both channels, and still
# halved the close labels. That is why the ratio is the primary fix.
#
# ── READ THE GUARDS FIRST, AT ITERATION 1 ───────────────────────────────────
#
#     c_max_steps       must stay near run 11's ~21/190
#     reached_standoff  must stay near run 11's ~129/190
#     mean_min_pos      must stay near run 11's ~0.049 m
#
# If those move, the noise is again holding the EE outside the commit radius and
# nothing downstream is interpretable — halve `dart_noise_ratio` again before
# touching alpha. Only once they hold do `c_env_done` and `c_close_label` mean
# anything.
#
# REACH-TAIL DART IS ON. Under `dart_noise` the reach is gated by
# `dart_noise_ratio`, not `dart_reach_ratio` (which is jolt-only); inside the
# committed reach Sigma is scaled by diag(0.3005 x3, 1.0 x3) and every draw is
# clearance-rejected against the observed cloud. Confirm at iteration 1 that
# `dart_reach` AND `dart_reject` are both nonzero — `dart_reach` counted only
# jolt-path perturbations until the run-14 fix, so runs up to 12 logged 0 there
# while reach noise was firing.
#
# ── COST ────────────────────────────────────────────────────────────────────
#
# Run 11 (the same substrate, working collection) took 7.11 h, 81% of it refit.
# `iter_epochs` 15 -> 20 puts this at ~9.0 h plus the base fit, call it ~9.5 h.
# Do NOT budget from run 12's 4.6 h — that was cheap only because its collection
# had collapsed and D grew 41% too slowly. Request 14:00:00.
#
# THE DATA IS ALREADY BUILT — the `_off` tables and shards, unchanged.
# docs/runbook_run10_train.md applies with the config name swapped.
# ─────────────────────────────────────────────────────────────────────────────

SIM:
  cfg_file: examples/pretrain_multicam_wr.yaml   # wrist + right
  split: train
  egl: false

  valid_grasp_dict_path: examples/valid_grasp_dict_005.pkl
  hand_collision_filter: false
  hand_collision_thresh: 0.08
  hand_points_radius: 0.35

  use_standoff: true
  standoff_dist: 0.08

  grasp_pin_table: output/regrasp_pins_train_off.json
  grasp_pin_match_tol: 0.02

  d_rule: grasp_offset
  d_point_depth: 0.1122
  d_min_offset: 0.02

  exclude_scenes: output/regrasp_pins_train_off_excluded.json
  demo_ok_table: output/regrasp_demos_train_off_ok.json

  # Run 11's label scheme, unchanged: train on the flown grasp's own direction,
  # deploy on the bin's empirical centroid.
  command_deploy: bin_centroid

  reach_filter: true
  reach_pos_thresh: 0.02        # m,   = DAGGER.close_pos_thresh
  reach_rot_thresh: 0.34        # rad, = DAGGER.close_rot_thresh

DAGGER:
  num_iters: 25
  episodes_per_iter: 600
  max_steps: 50
  scene_sampling: random
  seed: 0

  beta_schedule: linear
  beta_start: 0.9
  beta_end: 0.75
  beta_mid: 0.5
  beta_knee: 0.66
  beta_p: 0.7

  close_pos_thresh: 0.02
  close_rot_thresh: 0.34
  stop_on_close_label: true
  stop_on_policy_close: false

  ee_step: 0.04
  reach_tail: 5
  min_free: 1
  max_horizon: 40
  first_horizon: null

  reach_commit_dist: 0.05
  reach_skip_eps: 0.01
  expert_after_commit: true

  # ── THE ONLY CHANGE: ADD NOISE, DO NOT REPLACE THE ACTION ──────────────────
  dart_mode: dart_noise
  #
  # ── ALPHA IS 1.0, NOT THE PAPER'S 3.0, AND THAT IS DELIBERATE ─────────────
  #
  # The whole premise of this run is that the perturbation is knocking the object
  # out of the hand, so it MUST execute smaller than the jolt it replaces. At the
  # paper's alpha it does the opposite. The trace anchor is the MEASURED learner
  # error and alpha multiplies it, so sd = sqrt(alpha) x measured — and the real
  # covariance is anisotropic, so the largest axis runs away first:
  #
  #                              free pos sd (cm)        free rot sd (rad)
  #   jolt (uniform, replaces)   2.31 2.31 2.31          0.173 0.173 0.173
  #   alpha 3.0  (the paper)     2.43 2.79 4.17          0.142 0.100 0.115
  #   alpha 1.0  (HERE, iter 2)  1.41 1.61 2.41          0.082 0.058 0.067
  #   alpha 0.25 (HERE, iter 25) 0.72 0.82 1.23          0.042 0.030 0.034
  #
  # At alpha 3.0 the z axis executes 1.8x the jolt's sd. At 1.0 the noise sits in
  # the 1-2 cm band with the same ~2.5x cut in rotation, which is the whole
  # reason for the change. z stays the largest axis because the measured error
  # genuinely is anisotropic (pos z carries 1.7x the spread of pos x) — that is
  # the covariance doing its job, not a mis-scaling.
  #
  # Lower `dart_alpha_scale` before anything else if `c_env_done` does not fall.
  # RECALIBRATED TO THIS STACK'S OWN ANCHOR — see the header. Run 12 anchored
  # its table to phase 4's tr(Sigma_hat) = 0.0161; the `_off` stack measures
  # 0.0408 (run 10: 0.0411, run 11: 0.0399, run 12: 0.0408), so alpha 1.0
  # executed 1.59x the design and ran ABOVE the jolt it replaced for the first
  # half of the run. 0.25 puts the applied trace at 0.0102, which is where run
  # 12's final iterations actually measured: [1.36, 1.48, 1.82] cm and
  # [0.066, 0.054, 0.046] rad, i.e. inside the 1-2 cm band that was asked for.
  #
  # NOT run 13/14's 0.35 -> 0.18. Alpha multiplies the anchor, and the two
  # stacks measure different anchors, so the SAME executed magnitude needs
  # different alphas: 0.0102/0.0408 = 0.25 here, 0.0102/0.0287 = 0.35 there.
  # Copying run 14's number onto this stack would run it 1.4x hot.
  dart_alpha_scale: 0.25   # alpha at iteration 1   (run 12: 1.0)
  dart_alpha_end:   0.12   # alpha at iteration 25  (run 12: 0.25)
  # ── 0.3, NOT RUN 12'S 1.0. THIS IS WHAT BROKE RUN 12. ────────────────────
  # `dart_noise` fires only on EXPERT steps, so at beta 0.9 a ratio of 1.0
  # perturbs 90% of ALL steps against the jolt's 26% — 3.4x the duty cycle.
  # With no clean steps left the EE never converged inside
  # `reach_commit_dist: 0.05`, the reach never committed, and episodes timed out
  # 13 cm from the grasp (`c_max_steps` 21 -> 92, `reached_standoff` 129 -> 59,
  # `mean_min_pos` 0.049 -> 0.131, close labels 58% -> 26% of episodes).
  # Notably `c_env_done` went DOWN, 52 -> 46: the object was knocked out LESS.
  # The magnitude was the secondary fault; the firing rate was the primary one.
  #
  # 0.3 x 0.90 = 27% of all steps, matching the jolt's 26%.
  dart_noise_ratio: 0.3
  # Sigma is pooled over the whole episode, but the reach cannot take the free
  # phase's magnitude: 5 cm from the object a free-phase displacement knocks it
  # out of the hand. These reproduce the ratio the jolt already encoded
  # (0.01202/0.04 = 0.3005 for position; the reach jolt never scaled rotation
  # down). Applied as D Sigma D, so it scales sd and preserves PSD and the
  # correlation structure. Reach draws are clearance-rejected against the cloud
  # as the reach jolt was; a step whose every draw is refused falls back to the
  # clean expert action.
  dart_reach_pos_scale: 0.3005
  dart_reach_rot_scale: 1.0

  # Inert under dart_noise EXCEPT as the iteration-1 bootstrap: alpha is not
  # applied to it (there is no measurement to anchor yet), so these two numbers
  # alone set iteration 1's noise, as the diagonal Gaussian with the same
  # per-axis variance a^2/3 as the uniform box they describe.
  #
  # LOWERED FROM RUN 11's 0.04 / 0.3, because iteration 1 is exactly where DART
  # is most dangerous — the learner is barely trained and most likely to wander
  # into the object — and leaving them would run iteration 1 at full jolt
  # magnitude before alpha ever takes effect. 0.026 -> sd 1.50 cm and 0.121 ->
  # sd 0.070 rad, matching where alpha 1.0 puts iterations 2+.
  #
  # NOTE this is the one respect in which flipping `dart_mode: jolt` no longer
  # reproduces run 11: it would give a SMALLER jolt (+-2.6 cm, not +-4 cm).
  # `dart_ratio` / `dart_max_dist` / the reach jolt magnitudes are untouched.
  dart_ratio: 0.3
  dart_max_dist: 10.0
  dart_pos_mag: 0.026      # run 11: 0.04  -> bootstrap sd 1.50 cm
  dart_rot_mag: 0.121      # run 11: 0.3   -> bootstrap sd 0.070 rad
  dart_reach_ratio: 0.3
  dart_reach_pos_mag: 0.01202
  dart_reach_rot_mag: 0.3
  dart_reach_max_tries: 5
  dart_reach_clearance: 0.01
  dart_reach_path_steps: 4

  outcome_check: true

TRAIN:
  train_cfg: examples/configs/bc_regrasp_run9.yaml
  pc_pretrained:
  base_train_h5: ${REGRASP_DATA}/bc_dataset/train_regrasp_off.h5
  val_h5: ${REGRASP_DATA}/bc_dataset/val_regrasp_off.h5
  base_run: null
  base_epochs: 50
  # 20 TO MATCH RUN 14, not run 12's 15 — see the header. Under warm start this
  # is 20 MORE epochs on top of the chain rather than a complete fit, so by
  # iteration 25 the earliest shards have been seen ~500 epochs and the newest
  # 20. Watch `train_loss` and `val_loss` TOGETHER: a chain that memorises drives
  # the first down while the second flattens, which FTL cannot do the same way.
  iter_epochs: 20

  # ── WARM-STARTED CHAIN ────────────────────────────────────────────────────
  # false = each iteration initialises from the PREVIOUS iteration's weights
  # rather than refitting the aggregate from a random init: 0 -> 1 -> ... -> 25.
  # It still trains on the FULL aggregate every iteration; only the starting
  # point changes.
  #
  # THE NORMALIZER CHAINS WITH THE WEIGHTS AND IS NEVER RECOMPUTED.
  # `train_on_aggregate` loads `normalization.npz` from the run it is seeded
  # from, because the head's output scale is DEFINED by the normalizer and
  # recomputing it under warm-started weights would silently reinterpret the
  # head. So iteration 0's statistics — computed over the base demonstrations
  # alone, reach-filtered — are pinned for all 25 iterations. A real difference
  # from any FTL run that is not one of the six changed keys.
  train_from_scratch: false

  # `last`, matching run 14, not run 8's `best`. The end of the cosine schedule,
  # i.e. the most converged fit on the aggregate. COST: `EVAL.ckpt` is `best`, so
  # evaluation and the next collection run on best.pt while the weights carried
  # forward are last.pt — the chain and the data come from two slightly different
  # policies. Run 8 chose `best` to keep them the same. One word to flip.
  init_ckpt: last
  num_workers: 8
  device: cuda

EVAL:
  every: 1
  num_scenes: 100
  holdout: false
  max_steps: 50
  ckpt: best
  success_mode: stable_grasp
  hold_steps: 3
  select_on: success_rate
  verbose: false

  box_check: true
  box:
    min_frac: 0.50
    open_thresh: 0.8
    half_x: 0.0088
    z_lo: 0.0946
    z_hi: 0.1122
    inset: 0.002
    grid_x: 7
    grid_z: 7
