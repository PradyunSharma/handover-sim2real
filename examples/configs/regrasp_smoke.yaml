# ─────────────────────────────────────────────────────────────────────────────
# REGRASP SHAKEDOWN. Not a result — it exists to prove the wiring before a 20 h
# job is queued behind it. ~30 min on a V100.
#
#   = regrasp_run2.yaml with num_iters 2, m=8 (4 scenes x their directions),
#     base_epochs 3, iter_epochs 2, eval on 3 scenes, verbose.
#
# WHAT IT MUST SHOW, in this order:
#   grasp_mismatch      0    — a (scene, direction) never re-aimed between iterations
#   goal_switch         0    — and never moved within an episode
#   TWO distinct bin_assigned values on at least one scene in
#                              data/dagger_iter_01.h5 — a scene demonstrating one
#                              direction twice is the confound the pairing exists
#                              to break, and it would look identical in every
#                              aggregate number
#   dir_err             finite — not NaN. It is meaningless at 3 epochs; a NaN
#                              means the metric itself is not wired up
#   cond_delta          > 0  — the direction channels reach the network at all
#   n_b0 .. n_b5        the six per-bin denominators. With 3 eval scenes MOST OF
#                              THESE ARE 0, and the check is that their columns
#                              come out BLANK rather than 0.0 — a zero there
#                              would read as "this direction always fails".
#
#   sbatch --time=01:00:00 --export=ALL,RUN=regrasp_smoke,\
#       CFG=examples/configs/regrasp_smoke.yaml \
#       examples/slurm/train_regrasp.sbatch
#
# THE PATHS BELOW ARE THE REGRASP ONES. This file previously pointed at Phase 5's
# `train_p5.json` / `train_p5.h5`, which is worse than a missing file: the pin
# table loads, but it carries FPS-selected poses with no `bin` key, so
# `pin_table.bin_of()` returns None for every entry, every `bin_idx` becomes -1,
# and every per-bin column blanks out — a shakedown that passes while measuring
# nothing.
# ─────────────────────────────────────────────────────────────────────────────

SIM:
  cfg_file: examples/pretrain_multicam_wr.yaml
  split: train
  egl: false
  valid_grasp_dict_path: examples/valid_grasp_dict_005.pkl
  hand_collision_filter: false
  hand_collision_thresh: 0.08
  hand_points_radius: 0.35
  use_standoff: true
  standoff_dist: 0.08
  grasp_pin_table: output/regrasp_pins_train.json
  grasp_pin_match_tol: 0.02
  exclude_scenes: output/regrasp_pins_train_excluded.json
  # The shakedown reads the SAME (scene, bin) filter the real run does. Without
  # it the smoke would pass while the one path that can silently train on three
  # directions and score four went untested — and train_regrasp.sbatch derives
  # this file when it is missing, so the smoke is also what proves that
  # derivation works before a 24 h job depends on it.
  demo_ok_table: output/regrasp_demos_train_ok.json
DAGGER:
  num_iters: 2
  episodes_per_iter: 8
  max_steps: 50
  scene_sampling: random
  seed: 0
  beta_schedule: constant
  beta_start: 0.75
  beta_mid: 0.5
  beta_end: 0.3
  beta_knee: 0.66
  beta_p: 0.7
  close_pos_thresh: 0.02
  close_rot_thresh: 0.34
  stop_on_close_label: true
  stop_on_policy_close: false
  ee_step: 0.04
  reach_tail: 5
  min_free: 1
  max_horizon: 40
  first_horizon: null
  reach_commit_dist: 0.05
  reach_skip_eps: 0.01
  expert_after_commit: true
  dart_ratio: 0.3
  dart_max_dist: 10.0
  dart_pos_mag: 0.04
  dart_rot_mag: 0.3
  dart_reach_ratio: 0.3
  dart_reach_pos_mag: 0.01202
  dart_reach_rot_mag: 0.3
  dart_reach_max_tries: 5
  dart_reach_clearance: 0.01
  dart_reach_path_steps: 4
  outcome_check: true
TRAIN:
  train_cfg: examples/configs/bc_regrasp.yaml
  pc_pretrained: null
  base_train_h5: ${REGRASP_DATA}/bc_dataset/train_regrasp.h5
  val_h5: ${REGRASP_DATA}/bc_dataset/val_regrasp.h5
  base_run: null
  base_epochs: 3
  iter_epochs: 2
  train_from_scratch: false
  init_ckpt: best
  num_workers: 2
  device: cuda
EVAL:
  every: 1
  num_scenes: 3
  holdout: false
  max_steps: 50
  ckpt: best
  success_mode: stable_grasp
  hold_steps: 3
  select_on: success_rate
  verbose: true
  box_check: true
  box:
    min_frac: 0.5
    open_thresh: 0.8
    half_x: 0.0088
    z_lo: 0.0946
    z_hi: 0.1122
    inset: 0.002
    grid_x: 7
    grid_z: 7
