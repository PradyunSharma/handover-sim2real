# ─────────────────────────────────────────────────────────────────────────────
# REGRASP RUN 23 — RUN 19 WITH LESS DART, AND A FREE JOLT THAT TAPERS.
#
# Against regrasp_run19.yaml:
#
#   DAGGER.dart_ratio         0.3 -> 0.2     free band, less often
#   DAGGER.dart_reach_ratio   0.3 -> 0.2     reach band, less often
#   DAGGER.dart_taper_floor   (absent, = 1.0) -> 0.2    free jolt, smaller near
#   DAGGER.dart_taper_near    (absent) -> 0.05          the standoff
#   DAGGER.dart_taper_far     (absent) -> 0.20
#   DAGGER.replan_after_pin   (absent, = false) -> true    FIX 1, step-0 label
#
# Everything else is byte-identical to run 19: wrist + right cameras,
# `max_steps: 50`, `num_iters: 25` and therefore the same beta at every index,
# the per-bin table, the shield and its knobs, `iter_epochs: 20`,
# `d_source: d_grasp_world`, `train_from_scratch`. NOTHING TO REBUILD -- it reuses
# run 9/19's direction table, pin table, demo-ok table and base shards unchanged.
#
# `plane_gate` IS OFF -- that is the variable run 23 exists to replace, see below.
#
# ── WHAT THIS RUN CARRIES, AND WHAT IT THEREFORE ISOLATES ────────────────────
#
# BOTH bug fixes are on:
#
#   fix 1  `DAGGER.replan_after_pin: true`     step-0 expert label
#   fix 2  regrasp/setup.py, NO CONFIG KEY     worker/manager pin table
#
# Fix 2 cannot be turned off -- it is unconditional wherever `SIM.reach_filter`
# is on, which is the default -- so NO run on this code reproduces run 19 exactly.
# Its measurable effects are bookkeeping: ~18% fewer episodes per iteration on an
# entirely reachable pool, and `reached_grasp/episodes` up from 0.610 toward ~0.69
# ON ARITHMETIC ALONE. Those land on different columns from the DART change, so
# the two stay readable apart. DO NOT ATTRIBUTE A REACH-RATE GAIN HERE TO DART.
#
# The comparison this licenses:
#
#   run 23 vs run 22   BOTH fixes, BOTH at 25 iters / 50 steps / wrist+right, so
#                      they differ ONLY in how the reach corridor is protected
#                      (plane gate vs taper) AND in the DART ratios. This is the
#                      head-to-head the run is for.
#   run 23 vs run 19   conflates DART with both fixes. Readable only on columns
#                      the fixes do not touch.
#
# ── WHY LESS DART ────────────────────────────────────────────────────────────
#
# Run 19's driver split, measured: expert 58.2% / DART 29.7% / policy 12.2%.
# Nearly a third of every episode was a random task-space jump, and the LEARNER --
# the thing DAgger exists to correct -- drove one step in eight. Dropping both
# ratios to 0.2 raises the policy's share without touching beta, so more of the
# states being labelled are states the policy actually chose rather than states
# a coin flip put it in.
#
# ── WHY THE JOLT HAS TO TAPER ────────────────────────────────────────────────
#
# `dart_pos_mag: 0.04` is +-4 cm PER AXIS and fires at that size ANYWHERE in the
# free approach -- 40 cm out, where it is a nudge, and 5 cm from the standoff,
# where the reach band's own jolt is +-1.2 cm. Nothing ever tapered it, so the
# magnitude steps down 3.3x at the commit boundary for no reason but oversight.
#
# AND THE ROTATION IS THE REAL TERM. Run 21, `episode_00048`, scene 4: a jolt
# moves the hand 3.0 cm and rotates it 13.1 deg, while the object sits ~0.58 m
# from the EE origin IN THE EE FRAME -- so the rotation alone sweeps the observed
# cloud 13 cm (r*dtheta = 0.132 m vs 0.114 m measured). The policy's input is that
# cloud. A "4 cm" jolt is really a 13 cm observation jump, which is why both
# magnitudes taper together here.
#
# ── THIS IS THE PLANE GATE'S RIVAL, NOT ITS COMPANION ───────────────────────
#
# Run 21 measured the standoff plane gate refusing 54% of free-jolt proposals and
# LOSING 22% of all DART (dart/steps 0.268 -> 0.209): the 5-redraw budget runs out
# and the jolt is abandoned, and the survivors are uniform CONDITIONED ON NOT
# CROSSING -- a skewed distribution biased away from the object, removing exactly
# the recovery states nearest the goal.
#
# A taper reaches the same end by shrinking the noise instead of rejection-
# sampling it. No jolt is lost, the distribution stays symmetric, and a jolt at
# the standoff is +-0.8 cm / +-0.06 rad instead of being redrawn until it points
# away. RUN 23 AGAINST RUN 22 IS THE COMPARISON BETWEEN THE TWO APPROACHES, with
# the caveat that run 22 also carries `replan_after_pin`.
#
# ── WALL CLOCK ───────────────────────────────────────────────────────────────
# Run 19 measured ~16 h. Less DART changes nothing about cost; the pool fix
# removes ~18% of collection. Budget 14-16 h, request 20 h.
#
# ── WHAT TO READ ─────────────────────────────────────────────────────────────
#
#   dart_scale        NEW. Mean taper over EXECUTED free jolts. 1.0 would mean it
#                     never bit. Read it beside `dart`: if `dart_scale` is near
#                     the 0.2 floor, most jolts are firing close in and the taper
#                     is carrying the whole run.
#   dart / steps      should fall from run 19's 0.268 to ~0.18 by the ratio alone.
#                     NOT the 0.209 run 21 showed -- that was jolts being LOST.
#   expert_steps, policy-driven steps: the driver mix is what this run moves.
#                     `step_drivers` gives it per step now.
#   success_rate      directly comparable with run 19 iteration for iteration:
#                     same camera, same horizon, same beta at every index. Run 19
#                     mean 0.550 over iters 1-18, peak 0.743 @it25. NOISE FLOOR
#                     0.088 -- only a gain past ~0.09 is readable.
#   dir_track         run 19 reached 0.793 @it18.
#
# EVAL.holdout is still false -- optimistic, train-set numbers.
# ─────────────────────────────────────────────────────────────────────────────

SIM:
  cfg_file: examples/pretrain_multicam_wr.yaml   # wrist + right

  split: train
  egl: false

  # The paper's offline hand-collision-filtered grasp dict. Must be on
  # cfg.omg_config BEFORE the env is built. Keeps ~623/720 scenes planning,
  # against ~351 for the runtime 0.08 m filter — which is why that stays off.
  valid_grasp_dict_path: examples/valid_grasp_dict_005.pkl
  hand_collision_filter: false
  hand_collision_thresh: 0.08
  hand_points_radius: 0.35

  use_standoff: true
  standoff_dist: 0.08

  # PER-BIN: one grasp for every direction the scene can reach, each the goal-set
  # grasp CLOSEST TO THAT BIN'S AXIS — which is the vector the policy is
  # commanded with, so the demonstration is as close as the goal set allows to
  # the instruction. Built by assign_direction_demos.py --mode per-bin.
  #
  # Scenes carry 1 to 4 grasps, so `GraspPinTable.num_grasps` (a MIN) reads 1 and
  # is the WRONG accessor; `max_grasps` (4) sizes arrays and `num_grasps_for`
  # iterates. `episodes_per_iter` is divided by max_grasps to get the scene count.
  grasp_pin_table: output/regrasp_pins_train.json
  grasp_pin_match_tol: 0.02

  # Scenes with no feasible bin at all (6 of 623). Subtracted from BOTH pools.
  exclude_scenes: output/regrasp_pins_train_excluded.json

  # The (scene, BIN) pairs base collection actually demonstrated. Written by
  # audit_regrasp_demos.py --write-ok. `exclude_scenes` is scene-granular and
  # cannot say "this scene is fine for +x and +z but OMG could not plan -y"; this
  # can, and without it a per-bin planner failure trains on three directions and
  # scores four. Applied by pruning the pin table, so the collection pool, the
  # eval loop and `bin_of` cannot disagree about which pairs exist.
  demo_ok_table: output/regrasp_demos_train_ok.json

  # ── CHANGE 1 OF 2: WHAT THE POLICY IS COMMANDED WHENEVER IT ACTS ───────────
  #
  # `bin_centroid` = the unit mean of every `d_anchor` this bin was assigned,
  # taken over the table AFTER `demo_ok_table` prunes it — so it summarises the
  # demonstrations the run is actually trained on, not the ones that were hoped
  # for. Six vectors, no grasp needed, computable on the robot exactly as `BINS`
  # is. The resolved values are written to `<run>/command_axes.json`.
  #
  # ONE KEY BECAUSE FIVE THINGS MUST AGREE: DAgger rollouts, in-loop eval, the
  # retry ladder, the test set and the rollout viewer. A run in which any two of
  # them disagree reports nothing unusual — it simply tells the policy one thing
  # and scores it on another, and `dir_err` measures against the shifted target
  # too.
  #
  # `bin_axis` (the default, runs 2-8) and `grasp_axis` (run 1, not deployable)
  # are the other settings.
  command_deploy: bin_centroid

DAGGER:
  # 25, planned — the same count run 2 carries. Resumable, so a 24 h timeout at
  # iteration ~19 costs only the queue wait: resubmit the identical command.
  num_iters: 25
  # A TARGET, not an exact count. `sample_pairs` draws m // max_grasps = 100
  # scenes and rolls out EVERY bin each can reach, so the iteration lands near
  # 259 (the mean is 2.59 bins per scene). Drawing a scene's directions TOGETHER
  # is the point: rollouts differing only in the command are the only data that
  # can teach the network the command matters, and independent draws would spread
  # that contrast across the whole run.
  # 100 SCENES per iteration. max_grasps is 4 here, and
  # `sample_pairs` draws m // max_grasps scenes, so this is
  # 400 // 4 = 100.
  episodes_per_iter: 400
  max_steps: 50
  scene_sampling: random
  seed: 0

  # 1.0 -> 0.75 linearly over the 20 iterations. Iteration 1 is therefore PURE
  # EXPERT (see the header): a data-augmentation round, with the distribution
  # shift starting at iteration 2. Run 1 and Phase-4 run 16 both held 0.75
  # constant, so the late iterations here match them and the early ones are
  # gentler.
  # 0.9 -> 0.75 linearly over the 25 iterations. NO pure-expert round: the
  # distribution shift starts at iteration 1, and by the end a QUARTER of every
  # trajectory is the learner's own actions.
  #
  # 0.75 is the floor Phase-4 run 16 (0.80, the best run in the project) and
  # regrasp run 1 both held CONSTANT, so the late iterations here sit exactly
  # where those runs sat and the early ones are gentler. That makes this schedule
  # a strict interpolation between known-good settings rather than an
  # extrapolation past them — which 0.5 would have been, at double run 16's
  # on-policy fraction and beyond anything measured on this task.
  beta_schedule: linear
  beta_start: 0.9
  beta_end: 0.75
  beta_mid: 0.5          # unused by `linear`; kept so a switch to `piecewise`
  beta_knee: 0.66        # needs no other edit
  beta_p: 0.7

  close_pos_thresh: 0.02
  close_rot_thresh: 0.34
  stop_on_close_label: true
  stop_on_policy_close: false

  ee_step: 0.04
  # 5, not 10: the divergence profile between a scene's demonstrations was
  # measured FLAT (0.89x) over the tail, so a longer commit buys no extra
  # contrast and starves the free approach where obstacle avoidance is learned.
  reach_tail: 5
  min_free: 1
  max_horizon: 40
  first_horizon: null

  reach_commit_dist: 0.05
  reach_skip_eps: 0.01
  expert_after_commit: true

  # ---- RECOMPUTE THE STEP-0 LABEL AGAINST THE PINNED GRASP ----------------
  # FIX 1, ON. `false` (runs 1-20) keeps `expert_target_jp = plan[0]` from the
  # plan made BEFORE `pin_table.apply`, so at step 0 the expert action can aim at
  # a different grasp than the one the caption and the command name. `true`
  # re-runs the planner after the pin with `reset_scene=False` -- resetting would
  # rebuild the goal set and undo the pin -- and takes the label, the grasp pose
  # and the standoff from that plan. `collect_regrasp_demos.py` has always done
  # it this way; only the DAgger collector did not.
  #
  # ON HERE BECAUSE IT IS A CORRECTION, NOT A VARIANT. There is no version of the
  # loop that should aim the step-0 label at the wrong grasp, and its incidence
  # cannot be measured until `pin_goal_moved` is repaired, so holding it back
  # would buy an attribution that cannot currently be cashed.
  #
  # ⚠ `pin_goal_moved` IS VACUOUS AS SHIPPED. It read 0 in all 18 of run 21's
  # iterations because it compares the goal index against a value re-baselined
  # from the same post-pin read, and the pinned goal set holds ONE element, so it
  # can never fire. `replan_pin` ~= `episodes` confirms the fix itself runs every
  # episode. Treat incidence as UNMEASURED, not as zero.
  #
  # Costs one extra `run_omg_planner` per episode (step 0 only) and draws no RNG.
  replan_after_pin: true

  # DART ON BOTH BANDS, at Phase-4 run 16's magnitudes verbatim. `dart_ratio`
  # covers the FREE approach (with dart_max_dist: 10.0 the distance gate never
  # bites, so it fires anywhere before the commit) and `dart_reach_ratio` the
  # committed REACH TAIL, where the jolt is smaller (0.012 m) and clearance-tested
  # because the gripper is already inside the object's neighbourhood. Not
  # re-tuned: these were derived for this reach geometry and DART is not the
  # variable under test.
  # 0.3 -> 0.2 ON BOTH BANDS. Run 19's driver split was expert 58.2% / DART 29.7%
  # / policy 12.2%: nearly a third of every episode was a random jump, and the
  # LEARNER -- the thing DAgger is supposed to be correcting -- drove one step in
  # eight. At 0.2 the policy's share rises without touching beta, so the states
  # being corrected are more often states the policy actually chose.
  dart_ratio: 0.2
  dart_max_dist: 10.0
  dart_pos_mag: 0.04
  dart_rot_mag: 0.3

  # ---- TAPER THE FREE JOLT AS THE STANDOFF IS APPROACHED ------------------
  # `dart_pos_mag: 0.04` is +-4 cm PER AXIS, applied at the same size anywhere in
  # the free approach. That is a mild nudge 40 cm out and a catastrophe 5 cm from
  # the standoff, where the reach band's own jolt is only +-1.2 cm -- a 3.3x step
  # change at the commit boundary, for no reason other than that nothing tapered
  # it. These three keys scale BOTH magnitudes linearly from 1.0 at 20 cm to 0.2
  # at 5 cm and hold the floor inside that:
  #
  #     d_standoff   scale    pos        rot
  #     >= 0.200 m    1.00    +-4.00 cm  +-0.300 rad
  #        0.150 m    0.73    +-2.93 cm  +-0.220 rad
  #        0.100 m    0.47    +-1.87 cm  +-0.140 rad
  #     <= 0.050 m    0.20    +-0.80 cm  +-0.060 rad   (reach band: +-1.20 cm)
  #
  # so the free band now hands over to the reach band CONTINUOUSLY rather than
  # stepping down 3.3x.
  #
  # ROTATION IS TAPERED TOO, AND IT IS THE TERM THAT MATTERS. Measured on run 21
  # (`episode_00048`, scene 4): a jolt translates the hand 3.0 cm but rotates it
  # 13.1 deg, and the object sits ~0.58 m from the EE ORIGIN in the EE frame, so
  # the rotation alone sweeps the observed cloud 13 cm (r*dtheta = 0.132 m against
  # a measured 0.114 m of centroid motion). Tapering position while leaving
  # `dart_rot_mag` at 0.3 would scale the small term and keep the large one.
  #
  # THIS IS ALSO THE ALTERNATIVE TO RUN 21/22's PLANE GATE, which is off here.
  # Run 21 measured the gate refusing 54% of jolt proposals and LOSING 22% of all
  # DART (dart/steps 0.268 -> 0.209), because a full-size rotational jolt near the
  # standoff crosses the plane almost every time and the 5-redraw budget runs out.
  # A taper reaches the same end -- no violent jolts in the reach corridor -- by
  # shrinking the noise rather than rejection-sampling it, so the distribution
  # stays symmetric instead of becoming "uniform conditioned on not crossing".
  #
  # `dart_scale` in dagger_log.csv is the mean taper over EXECUTED jolts. 1.0
  # would mean it never bit; expect well under 1 once the approach is short.
  dart_taper_floor: 0.2
  dart_taper_near: 0.05
  dart_taper_far: 0.20

  # 0.3 -> 0.2, same argument as the free band. Magnitudes unchanged: the reach
  # jolt is already small (+-1.2 cm) and is what the taper above hands over to.
  dart_reach_ratio: 0.2
  dart_reach_pos_mag: 0.01202
  dart_reach_rot_mag: 0.3
  dart_reach_max_tries: 5
  dart_reach_clearance: 0.01
  dart_reach_path_steps: 4

  # ── THE SHIELD — the only change against run 9 ──────────────────────────────
  # See the header. `shield: false` (the default) reproduces run 9 exactly,
  # including its RNG stream, so this key is the whole experiment.
  shield: true
  # Metres. Matched to `dart_reach_clearance` deliberately: the reach jolt has
  # been judged at 1 cm since Phase-4 run 12 and refuses ~30% of its draws there,
  # which is a working operating point rather than a guess. The bar is relative,
  # so this is the floor that applies only when the expert had room to spare.
  shield_clearance: 0.01
  # Interpolation samples along the step being tested. 4 matches
  # `dart_reach_path_steps`; the endpoint alone would miss a step that cuts
  # through the object and arrives clear on the far side.
  shield_path_steps: 4
  # Redraws before a free-approach jolt is abandoned. Matched to
  # `dart_reach_max_tries`. If `shield_jolt_reject` approaches 5x `dart`, the
  # jolt magnitude is too large for the geometry and jolts are being skipped
  # rather than shielded — the same reading `dart_reject` gets.
  shield_jolt_max_tries: 5

  # Collection outcomes on the evaluator's taxonomy, so `c_success_rate` is
  # comparable with `success_rate` (mixture-driven, not policy-only) and the
  # per-bin collection counters have a `success` column meaning the same thing.
  outcome_check: true

TRAIN:
  # ── CHANGE 2 OF 2: THE LABEL SOURCE, AND THE NOISE OFF ────────────────────
  #
  # bc_regrasp_run9.yaml = bc_regrasp_run4.yaml (`d_noise_deg` 12 -> 0) plus
  # `DATA.d_source: d_grasp_world`. The label becomes the approach axis the
  # expert actually flew instead of the direction the episode was commanded —
  # a relabelling of shards already on disk, not a re-collection.
  #
  # THE NOISE HAS TO GO WITH IT. `d_noise_deg` existed to blur an exact command
  # so the policy would tolerate the ~18 deg gap between the bin axis and its
  # demonstration. Under a grasp-axis label that gap is zero by construction:
  # the label IS the demonstration. Perturbing it would only smear a command
  # that is now precise, which is the opposite of what the run is testing.
  #
  # The aux head stays on, as in run 2 — under direction conditioning it does
  # not predict its own input, so `aux_pos_mm` still separates "the features
  # have it and the action head ignores it" from "the observation cannot
  # support it".
  train_cfg: examples/configs/bc_regrasp_run9.yaml
  # Empty => PointNet++ initialised RANDOMLY. Iteration 0 only; every later
  # iteration warm-starts the WHOLE network from the previous last.pt and never
  # reads this.
  pc_pretrained:
  # `${REGRASP_DATA}` defaults to `output` and is set to $SCRATCH_ROOT/output
  # by the sbatch scripts. Only the two HDF5 shards move: together they are
  # ~1.1 GB against /home's HARD 30 GB quota, which fills SILENTLY and kills
  # the job with exit code 6 and no traceback. The JSON tables above stay in
  # the repo — a few MB, they are INPUTS rather than outputs, and /scratch is
  # purged by age.
  base_train_h5: ${REGRASP_DATA}/bc_dataset/train_regrasp.h5
  val_h5: ${REGRASP_DATA}/bc_dataset/val_regrasp.h5
  base_run: null
  # 50. The measured val minimum on run 1's base fit was epoch 16 (val_total
  # 0.1851, degrading to 0.239 by 99 with a 4.9x train/val gap), so 40 already
  # cleared it; 50 is margin against a differently-seeded init bottoming later,
  # and iteration 0 now has ~1.47x the data. Harmless either way — the epoch that
  # matters is whichever `last.pt` ends on.
  base_epochs: 50
  # ── 20, NOT RUN 9's 15 — THE SECOND CHANGE IN THIS RUN ─────────────────────
  # Under `train_from_scratch: true` below this is a COMPLETE refit budget: the
  # model starts from a random PointNet++ every iteration and has this many
  # epochs over the whole aggregate to get back. 15 was never argued for on this
  # aggregate; it was inherited from run 2.
  #
  # WHY 20. Phase-4 run 16 and run 19 — the two runs that transfer best to the
  # real robot, and the best in the project at 0.80 — are also FTL from scratch
  # and give each refit **25** epochs on a **100**-epoch base fit, against run
  # 9's 15 on 50. Run 9's curve then goes flat from iteration 14 (mean 0.504, sd
  # 0.053, trend +0.47 pp/iter over iters 14-25) while D grows 5174 -> 7968
  # episodes, which is the signature of a refit that cannot absorb the data it is
  # given. 20 moves a third of the way to Phase 4 without also changing the base
  # fit, which would be a third variable.
  #
  # THE BUDGET IS TIGHT EARLY AND COMFORTABLE LATE, because epochs are over a
  # GROWING D. In gradient steps (batch 64):
  #     iteration 0   50 epochs x  86k steps  =  67k steps
  #     iteration 1   20 epochs x  95k steps  =  30k steps   <- 1.36x run 9's
  #     iteration 25  20 epochs x ~530k steps = 166k steps   <- 2.5x it
  # So expect the early iterations to sit BELOW the base fit and recover as D
  # grows. That dip is a property of this schedule, not a failure — and 20
  # shortens it, which is half the point.
  #
  # 15 from random was already known to be ENOUGH FOR A WORKING POLICY —
  # regrasp3_fast1's base fit was exactly that (15 epochs, empty pc_pretrained,
  # 86k steps) for success 0.406 / bin_diag 0.406 at iteration 0 — so this is not
  # a fix for a broken budget. It is a test of whether "enough to work" is also
  # "enough to keep improving" on an aggregate 6x that size.
  #
  # COST: +33% on the training half of every iteration. Run 9 measured 13.4 h
  # over 26 iterations, so budget ~16-17 h rather than ~14.
  iter_epochs: 20
  # TRUE — paper-faithful Follow-The-Leader (Ross et al.): every iteration refits
  # from the initialisation on the whole aggregate, discarding the previous
  # iteration's weights. Phase-4 run 16, the best run in the project at 0.80,
  # did this.
  #
  # WITH `pc_pretrained` EMPTY THAT MEANS A RANDOM PointNet++ EVERY ITERATION,
  # not just at iteration 0. That is deliberate here — regrasp does not borrow
  # the CVPR2023 encoder — but it is the thing to check first if the run
  # underperforms: see the gradient-step table above, and compare
  # `success_rate` at iterations 1-3 against iteration 0. A run that never gets
  # back above its base fit is telling you the refit budget from random is not
  # enough on this aggregate, and the fix is `pc_pretrained` or more epochs, not
  # more iterations. THIS RUN TAKES THE "MORE EPOCHS" HALF OF THAT (15 -> 20),
  # so the iteration-1-to-3 recovery is one of the two things to read here.
  #
  # Costs nothing extra in wall clock: train_on_aggregate fits the whole D for
  # `iter_epochs` either way, so warm start and from-scratch differ only in the
  # starting weights.
  train_from_scratch: true
  # Inert while train_from_scratch is true (nothing is loaded from the previous
  # iteration). Kept so flipping that flag back needs no other edit.
  init_ckpt: best
  # 8, not 2. These are DataLoader workers for the REFIT, and during the refit
  # all 20 collection workers are idle — the node has 22 CPUs and two were
  # feeding the loader. Each sample is a 1024x8 float array read from HDF5, so
  # the loader is plausibly the bottleneck on an aggregate this size. Costs
  # nothing and cannot change results.
  num_workers: 8
  device: cuda

EVAL:
  # IN THE LOOP. ~16 min an iteration at 100 scenes x 2.59 directions; that is
  # 5.5 h on a ~20 h run, and it is what makes `ckpt`/`select_on` able to select
  # at all — with the split job the metrics arrived after the next iteration had
  # already started. Set to 2 if the queue makes the shorter job worth it.
  every: 1
  # 100 scenes -> ~259 episodes, ~65 per live bin. NOT randomly drawn: an
  # np.linspace over the usable scene ids, so the SAME 100 scenes are scored
  # every iteration and consecutive points are a paired comparison rather than
  # two independent samples. That is what makes a trend readable at n=65/bin,
  # where a single point's binomial standard error is ~0.05.
  num_scenes: 100
  # FALSE, as in run 1: the eval scenes are also collected on, so these are
  # TRAIN-SET rates and optimistic. Kept false deliberately — the curves are a
  # clean read of "is it learning what it is taught", and the held-out number
  # comes from examples/eval_regrasp_testset.py on the s0 TEST split afterwards.
  holdout: false
  max_steps: 50
  # LAST. Also picks the policy that collects the next iteration (train_regrasp
  # hands this same string to the workers), so one set of weights per iteration.
  # BEST. Selected on the lowest val loss of the fit; also picks the policy that
  # collects the next iteration, so one set of weights per iteration either way.
  #
  # THE HONEST CAVEAT, MEASURED. The val set is collected ONCE at beta=1 from
  # expert demonstrations and never changes, while D grows toward majority
  # on-policy states (53% by iteration 8 of regrasp_fast1). So val loss measures
  # the fit to a distribution that is a SHRINKING minority of the training data,
  # and it rises monotonically while success rises: corr(val_loss, success) =
  # +0.71 and +0.83 on the two fast runs, corr(on-policy share, val_loss) = +0.85
  # and +0.96. Selecting on it is therefore selecting on a drifting target.
  #
  # WHY IT IS STILL DEFENSIBLE HERE: at these epoch budgets `best` and `last` are
  # nearly the same checkpoint. Measured val gap between them is +0.000 to +0.001
  # at iter_epochs 6 and +0.002 to +0.005 at 15 — far below anything that moves
  # success. The choice is close to free in both directions. NOTE those numbers
  # were measured at 15 and this run fits 20, so the gap will be somewhat wider;
  # the trend is monotone in the budget and 20 is not far enough out to change
  # the conclusion, but it is an extrapolation rather than a measurement.
  #
  # THE SELECTION THAT ACTUALLY MATTERS is `select_on: success_rate` below, which
  # picks the best ITERATION on rollouts, where the differences (0.30 -> 0.48
  # across a run) are much larger than the eval noise.
  ckpt: best
  success_mode: stable_grasp
  hold_steps: 3
  select_on: success_rate
  verbose: false

  box_check: true
  box:
    min_frac: 0.50
    open_thresh: 0.8
    half_x: 0.0088
    z_lo: 0.0946
    z_hi: 0.1122
    inset: 0.002
    grid_x: 7
    grid_z: 7
