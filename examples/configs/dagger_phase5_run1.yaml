# ─────────────────────────────────────────────────────────────────────────────
# PHASE 5 RUN 1 — grasp-conditioned policy, four pinned grasps per scene.
#
# Baseline is Phase-4 run 16 (`dagger_phase4_all_beta075.yaml`, 0.80 @ it16).
# Everything not listed below is run 16's value.
#
# WHAT PHASE 5 IS FOR
#
# Phase 4 pins one grasp per scene and trains a policy that never goes there.
# Across runs 4-16, `near_rate` — closed within 2 cm / 0.34 rad of the pinned
# grasp — sat at 0.00-0.08 while `success_rate` reached 0.80. The policy learned
# to come away with the object from wherever it happened to arrive, and
# docs/run_index.md already named the cause: "the observation never says which
# orientation to arrive at". Run 13's auxiliary head was the weak test of that;
# it did not move near_rate either.
#
# Phase 5 is the strong version. The goal grasp becomes an INPUT, and each scene
# carries FOUR well-separated pinned grasps, so a failed handover can be retried
# under a different one. That is regrasping — and it is only meaningful if the
# policy's behaviour actually changes when the commanded grasp changes, which is
# what `cond_track` measures and why that column is read first.
#
# THE CHANGES AGAINST RUN 16
#
#   SIM.cfg_file            wlr -> wr        wrist + right; matches what
#                                            sim2real/ can actually produce
#   SIM.grasp_pin_table     1 -> 4 grasps    built by build_grasp_pin_table_multi
#                                            then pruned by select_pinned_grasps
#   SIM.exclude_scenes      new list         scenes that cannot supply 4 grasps
#   DAGGER.episodes_per_iter 100 -> 200      50 scenes x 4 slots
#   TRAIN.train_cfg         bc_phase5_cond   grasp conditioning ON, aux head OFF
#   TRAIN.pc_pretrained     (empty)          PointNet++ from scratch
#   TRAIN.iter_epochs       25 -> 12         holds wall clock at 2.2x the data
#   TRAIN.train_from_scratch true -> false   warm start each iteration
#   TRAIN.init_ckpt         best             borrow the previous iteration's best
#   EVAL.every              1 -> 0           scorer runs as its own job
#   EVAL.num_scenes         100 -> 50        x 4 slots = 200 eval episodes
#
# SAMPLING. `episodes_per_iter: 200` is 50 scenes x all 4 grasps, not 200
# independent (scene, grasp) draws. Two rollouts that differ ONLY in the
# commanded grasp — same scene, same start state, same cloud — are the only data
# that can teach the network the goal input matters, and drawing them together
# puts them in the same iteration and the same batches. The cost is scene
# coverage: 50 distinct scenes per iteration against run 16's 100.
#
# EPOCHS COME DOWN, NOT UP. The aggregate reaches ~220k steps by iteration 25
# (2.2x run 16's 99.5k). Run 16 spent 25 epochs per refit for ~34.4 M
# sample-passes and ~11.9 h of train_s; 12 epochs here spends ~39 M, so the wall
# clock lands near run 16's despite the extra data. Warm-starting is what makes
# 12 enough — the model is not relearning from zero every round. `base_epochs`
# stays at 100: iteration 0 sees 4x the data AND a randomly initialised
# PointNet++, so 100 is if anything the floor (budget ~78 min, against run 16's
# ~19).
#
# `init_ckpt: best` is deliberate but worth an A/B. `best.pt` is selected on val
# loss, and docs/run_index.md concludes val loss is a poor selection target once
# the joint state is dropped (run 4 had double run 3's val loss and 4x the
# success). Runs 20 and 21 warm-start from `last` for that reason. Note also that
# warm-starting freezes the normalizer at the base run's statistics for all 25
# iterations — with a 4x base set those stats are better estimated than run 16's,
# so that cuts in this run's favour.
#
# WHAT WOULD FALSIFY THIS
#
# `cond_track` near 0 with `near_rate` still ~0.05 means the network is ignoring
# the conditioning and averaging the four modes; expect success_rate BELOW run
# 16's 0.80 in that case, and move the conditioning from concatenation to FiLM.
# `cond_track` near 1 with `near_rate` still low means the policy separates the
# conditions but tracks none of them — that points at the reach endgame, and run
# 21's open-loop pre-grasp commit becomes the thing to merge in.
#
# And the standing caveat: the Phase-4 noise floor on 100 eval scenes is +-0.115
# (six identical base fits spanning 0.32-0.62). Any success_rate difference
# against run 16 smaller than ~0.15 is unreadable. Prefer `near_rate` and
# `cond_track`, which sit near zero today and have room to move.
#
# THIS IS A COMBINATION RUN, not a controlled test: conditioning, the aux head,
# the cameras, the encoder init and the epoch budget all move at once.
#
# BUILD THE DATA FIRST — see README_PHASE5.md. All four paths below move
# together; swapping one without the others silently produces nonsense.
# ─────────────────────────────────────────────────────────────────────────────

SIM:
  cfg_file: examples/pretrain_multicam_wr.yaml   # wrist + right
  split: train
  egl: false

  # The paper's offline hand-collision-filtered grasp dict. Must be on
  # cfg.omg_config BEFORE the env is built. Keeps ~623/720 scenes planning,
  # against ~351 for the runtime 0.08 m filter — which is why that stays off.
  valid_grasp_dict_path: examples/valid_grasp_dict_005.pkl
  hand_collision_filter: false
  hand_collision_thresh: 0.08
  hand_points_radius: 0.35

  use_standoff: true
  standoff_dist: 0.08

  # FOUR grasps per scene, in farthest-point-sampling order under the
  # flip-invariant control-point metric. Slot 0 is OMG's own pick, so `succ_g0`
  # is the column comparable with a Phase-4 run.
  grasp_pin_table: output/bc_dataset/train_p5.json
  grasp_pin_match_tol: 0.02

  # Scenes that could not supply 4 separated grasps whose demonstrations all
  # succeeded. Written by select_pinned_grasps.py; subtracted from BOTH the
  # collection pool and the eval set.
  exclude_scenes: output/bc_dataset/train_p5_excluded.json

DAGGER:
  num_iters: 25
  episodes_per_iter: 200        # 50 scenes x 4 grasps
  max_steps: 50
  scene_sampling: random
  seed: 0

  beta_schedule: constant
  beta_start: 0.75
  beta_mid: 0.5
  beta_end: 0.3
  beta_knee: 0.66
  beta_p: 0.7

  close_pos_thresh: 0.02
  close_rot_thresh: 0.34
  stop_on_close_label: true
  stop_on_policy_close: false

  ee_step: 0.04
  reach_tail: 5
  min_free: 1
  max_horizon: 40
  first_horizon: null

  reach_commit_dist: 0.05
  reach_skip_eps: 0.01
  expert_after_commit: true

  # DART, exactly as run 16. Not re-tuned for Phase 5: its magnitudes were
  # derived for this reach geometry and this is not the variable under test.
  dart_ratio: 0.3
  dart_max_dist: 10.0
  dart_pos_mag: 0.04
  dart_rot_mag: 0.3
  dart_reach_ratio: 0.3
  dart_reach_pos_mag: 0.01202
  dart_reach_rot_mag: 0.3
  dart_reach_max_tries: 5
  dart_reach_clearance: 0.01
  dart_reach_path_steps: 4

  # Collection outcomes on the evaluator's taxonomy, so `c_success_rate` is
  # directly comparable with `success_rate` (mixture-driven, not policy-only).
  outcome_check: true

TRAIN:
  train_cfg: examples/configs/bc_phase5_cond.yaml
  # Empty => PointNet++ initialised randomly (iteration 0 only).
  pc_pretrained:
  base_train_h5: output/bc_dataset/train_p5.h5
  val_h5: output/bc_dataset/val_p5.h5
  base_run: null
  base_epochs: 100
  iter_epochs: 12
  train_from_scratch: false
  init_ckpt: best
  num_workers: 2
  device: cuda

EVAL:
  # 0 = skip in-loop; run examples/slurm/eval_dagger_run_p5.sbatch alongside.
  # Eval is 4x the episodes it was in Phase 4 and is off the critical path (the
  # loop hands the next collection its policy before eval would run), so leaving
  # it inline would cost ~40% of wall clock for nothing.
  every: 0
  num_scenes: 50                # x 4 grasps = 200 eval episodes per iteration
  holdout: false
  max_steps: 50
  ckpt: best
  success_mode: stable_grasp
  hold_steps: 3
  select_on: success_rate
  verbose: false

  box_check: true
  box:
    min_frac: 0.50
    open_thresh: 0.8
    half_x: 0.0088
    z_lo: 0.0946
    z_hi: 0.1122
    inset: 0.002
    grid_x: 7
    grid_z: 7
