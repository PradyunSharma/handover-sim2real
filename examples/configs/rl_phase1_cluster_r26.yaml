# Phase-3 RL config — rl_run26 (CLUSTER, 16 workers). Same as rl_run25 except TWO
# changes: (1) the demo fraction is a FLAT CONSTANT 0.05 (ramp disabled), and
# (2) num_iters 700 -> 250 (run23 length).
#
# run25 ramped demo_frac 0.5 -> 0.3 over 125 iters (demo-heavy early bridge, then a
# 0.3 floor). This run instead mixes a constant 5% demos every iter for the whole
# run: demo_frac_start/_end/_ramp are REMOVED, so demo_frac_at() falls back to the
# constant `demo_frac: 0.05` (see train_rl.py:demo_frac_at). This tests a much
# LEANER demo reliance (5% vs run25's 30-50%) — both the early bridge and the
# steady-state floor drop to 0.05.
#
# Curriculum unchanged from run25/run23: widening reverse curriculum, upper bound
# expert_initial_hi=24 FIXED, lower bound annealed 22 -> 2 over 150 iters (band
# [22,24] -> [2,24] over iters 0..150, then HELD [2,24]). With num_iters 250 the
# post-curriculum hold is only 100 iters (250-150) instead of run25's 550.
# beta_ramp 63, mix_ramp 50000, vgd hand-collision filter, stable_grasp all unchanged.
#
# 250 * 16 = 4000 episodes, 250 * 800 = 200000 updates — comfortably inside the 24h
# walltime cap (no resume expected). Pair with the vgd demos:
#   --demos output/rl_demos/train_h30_vgd.h5

DATA:
  num_pts:         1024
  pc_channels:     5

MODEL:
  q_hidden:  [256, 256]
  clock_dim: 1

RL:
  gamma:        0.95
  tau:          0.005
  policy_noise: 0.2
  noise_clip:   0.5
  act_limit:    5.0
  policy_delay: 2
  mc_blend:     0.5
  pose_loss:    smooth_l1
  bc_weight:    2.0
  gripper_bc_weight: 1.0
  gripper_close_weight_max: 10.0
  gripper_label_smooth: 0.1
  shaping_pos_weight: 0.0
  shaping_rot_weight: 0.0
  aux_weight:   0.5
  reward_mode:  stable_grasp
  hold_steps:   3
  # HAND-COLLISION FILTER — PAPER'S offline valid_grasp_dict (run21/vgd), NOT run15's
  # runtime 0.08 m filter. hand_collision_filter=false so our runtime filter is OFF.
  valid_grasp_dict_path: examples/valid_grasp_dict_005.pkl
  hand_collision_filter: false
  hand_collision_thresh: 0.08   # (unused while hand_collision_filter=false)
  hand_points_radius:    0.35   # (unused while hand_collision_filter=false)
  pg_normalize: true
  alpha:        0.1
  mix_start:    0.1
  mix_end:      0.2
  mix_ramp:     50000
  actor_lr:     3.0e-4
  critic_lr:    3.0e-4
  grad_clip:    1.0

LOOP:
  capacity:             20000
  pretrain_updates:     2000
  # DEMO FRACTION — flat constant 0.05 (CHANGE vs run25). The demo_frac_start/_end/
  # _ramp keys are intentionally omitted so demo_frac_at() uses this constant every
  # iter (train_rl.py:demo_frac_at falls back to `demo_frac` when demo_frac_start is
  # unset). run25 ramped 0.5 -> 0.3; this run holds 0.05 throughout.
  demo_frac:            0.05
  warmup_episodes:      0
  warmup_beta:          1.0
  episodes_per_iter:    16
  updates_per_iter:     800
  batch_size:           64
  num_iters:            250     # run23 length (CHANGE vs run25's 700)
  # exploration
  noise_std:            0.03
  # ── WIDENING reverse curriculum (same as run25) ───────────────────────────
  expert_initial_hi:            24    # FIXED upper takeover bound
  expert_initial_lo_start:      22    # band [22,24] at iter 0
  expert_initial_lo_end:        2     # band [2,24] after anneal
  expert_initial_anneal_iters:  150   # anneal 0..150, then hold [2,24]
  expert_episode_frac:  0.5
  rollout_max_steps:    30
  # DAgger tail replans (run15 values)
  dagger_ratio:         0.5
  dagger_min_step:      5
  dagger_tail_guard:    8
  # DART — run23 values (policy-DART, ratio 0.2)
  dart_mode:            policy
  dart_ratio:           0.2
  dart_min_step:        15
  dart_max_step:        22
  dart_pos_mag:         0.04
  dart_rot_mag:         0.2
  beta_start:           0.5
  beta_end:             0.0
  beta_ramp_iters:      63
  # eval / checkpoint
  eval_every:           7
  eval_episodes:        64
  save_every:           7
