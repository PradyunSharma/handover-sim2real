# ─────────────────────────────────────────────────────────────────────────────
# Regrasp learner config: the APPROACH-DIRECTION-conditioned single-frame policy.
#
# = the Phase-5 config with the conditioning moved out of an MLP branch and into
# the point cloud itself.
#
#   1. DATA.pc_channels 5 -> 7        THE change. Two per-point channels carry
#      MODEL.direction_cond: true     the command: d.n_i ("is this surface facing
#                                     the incoming gripper?") and
#                                     d.normalize(p_i - c) ("is this point on the
#                                     side I am approaching from?"). Points on the
#                                     commanded side are MARKED IN THE INPUT
#                                     rather than described by a vector beside it.
#   2. GraspEncoder deleted           No global branch, deliberately. If dir_track
#      policy_hidden back to [256,256] comes back flat, adding a small d-MLP is
#                                     run 2, and the gap between the runs measures
#                                     how much the SA-layer max-pooling destroys.
#   3. DATA.reach_tail 10 -> 5        MEASURED on train_regrasp.h5. Phase 5 widened
#                                     this because its four grasps shared a free
#                                     approach and diverged only into the reach —
#                                     the profile peaked 5-9 steps out and collapsed
#                                     to ~0 over the last four. Direction
#                                     conditioning has NO shared free approach: the
#                                     two demos come in from opposite sides from
#                                     step 0. Mean pairwise |dpos| difference by
#                                     step-from-end over 471 paired scenes:
#
#                                       step  0     1     2     4     6     8    12
#                                       diff  .043  .053  .056  .068  .117  .104 .093
#
#                                     last-10 mean 0.083 vs steps 10-15 mean 0.093 —
#                                     a ratio of 0.89, i.e. the signal is slightly
#                                     STRONGER early. At reach_tail 10 the weighting
#                                     sent 74% of draws to 53% of the data and
#                                     starved the free approach, which is where
#                                     obstacle avoidance lives. Watch f_human_contact
#                                     either way.
#   4. DATA.d_noise_deg: 12.0         Perturb the command once per EPISODE, train
#                                     only. Teaches interpolation between bins and
#                                     robustness to the fact that a test-time bin
#                                     CENTRE never matches a demo's realised
#                                     direction — the demo's d is wherever OMG
#                                     actually flew, somewhere inside the bin.
#
# WHY A DIRECTION AND NOT A POSE. A pose needs a grasp proposer at deployment
# (`sim2real/my_policy_runner.py` has none), it is per-object so coverage does not
# transfer, and it bakes k into the data. A direction is object-agnostic, so the
# k bins need covering ACROSS the dataset rather than per object, and because the
# network reads a continuous unit vector rather than a one-hot, k is a pure
# test-time knob up to about 20 (past that the bins are closer than 40 degrees and
# stop being independent retry hypotheses).
#
# AND IT MAKES THE WRIST-FLIP AMBIGUITY IMPOSSIBLE. `augment_flip_grasp` appends
# twins rotated pi about
# the gripper's own +z, which leaves column 2 of R untouched — so d = -R[:,2] is
# IDENTICAL for a grasp and its wrist-flip twin (measured at 0.000e+00 over 2000
# random poses). The flip ambiguity that forced the whole flip-quotient metric
# cannot arise when the command is a direction.
#
# MEASURED FEASIBILITY, and it constrains what this config can be asked to do.
# Over 623 scenes and 28339 goal-set grasps on s0/train:
#     +x free end 490 scenes   +z top-down 415   +y 366   -y 325
#     -x over the fingers 12 (0.19% of grasps)   -z from beneath 0
# so FOUR of the six bins are live, and -x/-z are directions the policy will
# EXTRAPOLATE into if the feasibility mask ever admits them. 491/623 scenes supply
# a separated PAIR; the other 126 give one demo and cannot break the confound.
#
# THE CONFOUND IS THE REASON FOR PAIRS, and it is a property of the DATASET that
# no architecture reaches: at one demonstration per scene, d is a deterministic
# function of the observation across the whole dataset, so the network can drive
# the loss to its floor by learning scene -> action and ignoring the channels
# entirely. Two demos of one scene under different d map the SAME observation to
# two DIFFERENT actions. Watch `cond_delta` in the val log: non-zero at init
# (random weights respond to their inputs), and DECAYING toward zero is the
# signature of the network learning to ignore the command.
#
# CAPACITY GOES DOWN, not up. The fused vector returns to 2*feature_dim = 512
# because there is no conditioning branch to concatenate, so policy_hidden goes
# back to [256, 256]. The only shape that grows is the first PointNet++ conv,
# [64, 8, 1, 1] -> [64, 10, 1, 1] — the single tensor that depends on
# pc_channels, and the reason a 5-channel checkpoint cannot strict-load here.
# ─────────────────────────────────────────────────────────────────────────────

DATA:
  # Overwritten by train_regrasp.py with the aggregate file list.
  train_h5: output/bc_dataset/train_p5.h5
  val_h5: null
  pc_channels: 7              # xyz + ycb + hand + d.n + d.r  (the last two
                              # are the conditioning, appended per point)
  d_noise_deg: 12.0           # TRAIN ONLY; val is forced to 0.0
  robot_state_dim: 32
  action_dim: 7
  reach_tail_weight: 2.5
  reach_tail: 5            # back to run 16's value — MEASURED, see below

MODEL:
  feature_dim: 256
  robot_hidden: 128
  policy_hidden: [256, 256]
  pointnet_scale: 1
  pointnet_radius: 0.02
  pointnet_nclusters: 32
  use_prev_act: false
  drop_joint_state: true      # the single largest effect measured in this project
  joint_state_dim: 18
  # ---- Regrasp ----
  direction_cond: true        # the command is per-point in the cloud, not an MLP
  # ---- off, and why: see the header ----
  aux_head: false
  aux_dim: 7
  aux_hidden: [256, 256]
  # Empty => random PointNet++ init. Only iteration 0 is affected; later
  # iterations warm-start from the previous checkpoint and never read this.
  pc_pretrained:
  freeze_pc: false

OPTIM:
  kind: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine

LOSS:
  gripper_weight: 1.0
  pose_loss: pm
  pm_weight: 7.0
  aux_weight: 0.0             # off by ONE-VARIABLE-AT-A-TIME, not by
                              # necessity: the aux head is legitimate
                              # again now the policy is not told the pose

TRAIN:
  batch_size: 64
  num_epochs: 100             # overridden per fit by DAGGER's base/iter epochs
  num_workers: 4
  device: cuda
  mixed_precision: false
  val_every: 1
  save_every: 5
  grad_clip: 1.0
  seed: 0
