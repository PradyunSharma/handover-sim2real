# Phase-3 RL config — rl_run29 (CLUSTER, 16 workers). Base = rl_run25's yaml (widening
# curriculum + vgd hand filter, WARM-STARTED, full 32-D robot state) but with the LOSS
# reverted to the CVPR2023 PAPER'S recipe (GA-DDPG core), and num_iters 700 -> 250:
#   (1) more RL weight  : pg_normalize false + mix_end 0.2 -> 0.3, AND bc_weight 2 -> 1
#       (the paper's BC coeff is just (1-mix); our x2 amplification removed).
#   (2) point-matching BC: pose_loss smooth_l1 -> pm (paper's control-point ADD metric).
#   (3) more goal-aux    : aux_weight 0.5 -> 1.0 (the paper's unit weight).
#   (4) 1-step Bellman   : mc_blend 0.5 -> 0.0 (no MC-return blend).
#   (5) raw PG on Q      : pg_normalize false -> PG = mix_policy_ratio * min(Q1,Q2),
#       mix ramping mix_start(0.1) -> mix_end(0.3) over mix_ramp updates (paper form).
# Deviation kept vs paper: the GRIPPER is still an in-actor BCE (gripper_bc_weight 1.0),
# not a separate grasp-predictor net — that would be an architecture change, not asked.
# RISK: raw PG (no pg_normalize) above the paper's 0.2 mix cap can let the actor exploit
# the critic (run1/run4 failure mode) — mitigated because sparse-reward Q is bounded ~1
# and the gripper channel is detached from the PG path. If it diverges, dial mix_end -> 0.2.
# Pair with the vgd demos:  --demos output/rl_demos/train_h30_vgd.h5

DATA:
  num_pts:         1024
  pc_channels:     5

MODEL:
  q_hidden:  [256, 256]
  clock_dim: 1

RL:
  gamma:        0.95
  tau:          0.005
  policy_noise: 0.2
  noise_clip:   0.5
  act_limit:    5.0
  policy_delay: 2
  mc_blend:     0.0       # run29: 1-step Bellman (paper); was 0.5 (MC-return blend)
  pose_loss:    pm        # run29: point-matching BC (paper); was smooth_l1
  bc_weight:    1.0       # run29: paper BC coeff = (1-mix) only; was 2.0 (x2 amplified)
  gripper_bc_weight: 1.0
  gripper_close_weight_max: 10.0
  gripper_label_smooth: 0.1
  shaping_pos_weight: 0.0
  shaping_rot_weight: 0.0
  aux_weight:   1.0       # run29: paper's unit goal-aux weight; was 0.5
  reward_mode:  stable_grasp
  hold_steps:   3
  # HAND-COLLISION FILTER — PAPER'S offline valid_grasp_dict (run21/vgd), NOT run15's
  # runtime 0.08 m filter. hand_collision_filter=false so our runtime filter is OFF.
  valid_grasp_dict_path: examples/valid_grasp_dict_005.pkl
  hand_collision_filter: false
  hand_collision_thresh: 0.08   # (unused while hand_collision_filter=false)
  hand_points_radius:    0.35   # (unused while hand_collision_filter=false)
  pg_normalize: false     # run29: RAW mix_policy_ratio on Q (paper); was true (λ=α/mean|Q|)
  alpha:        0.1        # (unused when pg_normalize=false; λ comes from mix_start/end)
  mix_start:    0.1        # PG weight early (paper)
  mix_end:      0.3        # run29: MORE RL weight — PG ceiling 0.2 (paper cap) -> 0.3
  mix_ramp:     50000
  actor_lr:     3.0e-4
  critic_lr:    3.0e-4
  grad_clip:    1.0

LOOP:
  capacity:             20000
  pretrain_updates:     2000
  demo_frac:            0.25
  demo_frac_start:      0.5
  demo_frac_end:        0.3
  demo_frac_ramp:       125
  warmup_episodes:      0
  warmup_beta:          1.0
  episodes_per_iter:    16
  updates_per_iter:     800
  batch_size:           64
  num_iters:            250     # run29: probe length (run25 used 700)
  # exploration
  noise_std:            0.03
  # ── WIDENING reverse curriculum (same as run23) ───────────────────────────
  expert_initial_hi:            24    # FIXED upper takeover bound
  expert_initial_lo_start:      22    # band [22,24] at iter 0
  expert_initial_lo_end:        2     # band [2,24] after anneal
  expert_initial_anneal_iters:  150   # unchanged: anneal 0..150, then hold [2,24]
  expert_episode_frac:  0.5
  rollout_max_steps:    30
  # DAgger tail replans (run15 values)
  dagger_ratio:         0.5
  dagger_min_step:      5
  dagger_tail_guard:    8
  # DART — run23 values (policy-DART, ratio 0.2)
  dart_mode:            policy
  dart_ratio:           0.2
  dart_min_step:        15
  dart_max_step:        22
  dart_pos_mag:         0.04
  dart_rot_mag:         0.2
  beta_start:           0.5
  beta_end:             0.0
  beta_ramp_iters:      63
  # eval / checkpoint
  eval_every:           7
  eval_episodes:        64
  save_every:           7
