DATA:
  train_h5:
  - output/bc_dataset/train_pinned_omg_ok.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_01.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_02.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_03.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_04.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_05.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_06.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_07.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_08.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_09.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_10.h5
  - output/dagger_runs/dagger4_run3/data/dagger_iter_11.h5
  val_h5: output/bc_dataset/val_pinned_omg_ok.h5
  pc_channels: 5
  robot_state_dim: 32
  action_dim: 7
MODEL:
  feature_dim: 256
  robot_hidden: 128
  policy_hidden:
  - 256
  - 256
  pointnet_scale: 1
  pointnet_radius: 0.02
  pointnet_nclusters: 32
  use_prev_act: false
  pc_pretrained: output/cvpr2023_models/2022-10-16_08-48-30_finetune_5_s0_train/DDPG_state_feat_PandaYCBEnv_latest
  freeze_pc: false
OPTIM:
  kind: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
LOSS:
  gripper_weight: 1.0
TRAIN:
  batch_size: 64
  num_epochs: 25
  num_workers: 2
  device: cuda
  mixed_precision: false
  val_every: 1
  save_every: 5
  grad_clip: 1.0
  seed: 11
